; MZRaku regression-suite settings. regress.py copies this file next to
; the emulator in every case's sandbox, so results never depend on the
; developer's own bin\Debug\settings.ini (and that file is never touched).
;
; Values are the shipped defaults unless noted. Changing anything that
; affects emulation (machine options, key maps, ROM paths) changes the
; expected output: re-approve the goldens in the same commit.
;
; Window positions and debugger breakpoints are deliberately absent.

[Display]
Scale=2
Scanlines=false

[Machine]
; Every case picks its machine on the command line; this is only the
; fallback.
DefaultMachine=MZ700

[Display.MZ80A]
GreenScreen=true

[Hardware.MZ800]
MZ1R25=true

[Keyboard.MZ80A]
InvertLetterShift=false

[Roms.MZ700]
; regress.py fills roms\ and basic\ from _mz-information-repository.
Monitor=roms\1z-013a.rom
Font=roms\mz700fon.int
Basic=basic\1Z-013B.mzf

[Roms.MZ80A]
Monitor=roms\SA-1510.rom
Font=roms\SA-CG.rom
Basic=basic\SA-5510.mzf

[Roms.MZ800]
Monitor=roms\MZ800.ROM
Font=
Basic=basic\1Z-016.mzf

[Joystick]
Button1=0
Button2=1

[KeyOverrides.MZ700]

[KeyOverrides.MZ80A]

[KeyOverrides.MZ800]

[CharMap]

[CharMap.MZ80A]

[CharMap.MZ800]

[DebugPanes]
Debugger=false
MemoryViewer=false
HidDiagnostic=false
FontSheet=false
SoundDiagnostic=false
KeyboardMatrix=false
