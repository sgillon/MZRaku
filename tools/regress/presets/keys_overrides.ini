; Regression preset for the *_keys cases (tools/regress/README.md):
; key overrides on all three machines, loaded read-only with
; --settings=keys_overrides.ini. Everything else is the default.
;
; Override lines are <KeyName>=<row>,<col>,<shift>, as in settings.ini:
; <shift> is t (MZ SHIFT forced on), f (forced off) or - (PC Shift
; passes through). Both bind row 7 column 7: INST/CLR on the MZ-700
; and MZ-800, HOME/CLR on the MZ-80A (unshifted/shifted).
;   F6  with an explicit SHIFT: CLR on all three
;   F7  with SHIFT forced off even while PC Shift is held: INST on the
;       MZ-700 and MZ-800, HOME on the MZ-80A

[KeyOverrides.MZ700]
F6=7,7,t
F7=7,7,f

[KeyOverrides.MZ80A]
F6=7,7,t
F7=7,7,f

[KeyOverrides.MZ800]
F6=7,7,t
F7=7,7,f
