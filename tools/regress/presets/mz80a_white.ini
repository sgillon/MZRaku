; Regression case mz80a_settings: run with --settings=<this file>.
;
; Deliberately minimal. Only the MZ-80A screen colour differs from the
; defaults (white instead of green), so the frame shows these settings
; were used. Everything else is missing: ROM paths are found by the
; auto-detect, and a normal settings.ini this incomplete would be
; rewritten in full on load. Under --settings nothing is written, so
; regress.py fails the case if this file (or the sandbox's own
; settings.ini) changes.

[Display.MZ80A]
GreenScreen=false
